# Nginx site config for hqhb. Serves the built React app as static files
# and reverse-proxies /api and /health to the backend (PM2, port 5000) -
# frontend and backend end up same-origin, so no CORS/cross-site cookie
# concerns in production at all.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/hqhb
#          sudo ln -s /etc/nginx/sites-available/hqhb /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # replace with your domain once you have one

    root /var/www/hqhb/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # SPA client-side routing - any unmatched path falls back to index.html
    # so React Router (not Nginx) decides what to render, including the
    # NotFound page for a genuinely bad path.
    location / {
        try_files $uri /index.html;
    }
}
